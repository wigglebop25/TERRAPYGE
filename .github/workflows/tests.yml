name: tests

on:
  # Development happens on dev, so pushes are only tested there. main is a
  # release branch: it is not pushed to directly, and its content is verified
  # through the dev -> main pull request instead.
  push:
    branches: [dev]
  # pull_request.branches filters on the BASE branch. main must stay listed:
  # the main protection ruleset requires the "unit tests" check, so a PR
  # targeting main has to run it or it could never merge.
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, reliable signal on every push and pull request. Installs only the
  # scientific stack the unit tests need, rather than the full package, so the
  # required check stays under a minute.
  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            torch-geometric \
            numpy \
            scipy \
            scikit-learn \
            pandas \
            matplotlib \
            pyyaml \
            geopandas \
            pytest

      - name: Run tests
        run: |
          python -m pytest \
            tests/test_physics.py \
            tests/test_spatial_cv.py \
            tests/test_metrics.py \
            -v

  # Full-stack installation check: installs the package exactly as a user
  # would, then asserts every declared dependency imports. Runs on pull
  # requests only. Kept advisory because the geospatial stack pulls native
  # libraries that can fail to build on a runner for reasons unrelated to the
  # change under review.
  installation:
    name: installation smoke test (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run installation smoke test
        run: python -m pytest tests/test_installation.py -v
